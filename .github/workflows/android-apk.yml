name: Android APK on demand
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools and platform
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path "*/bin/sdkmanager" -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/android-commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-commandlinetools
            mv /tmp/android-commandlinetools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Build ARM64 Alpine PRoot from pinned sources
        run: python3 scripts/build_alpine_native.py
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Verify ARM64 runtime packaged in APK
        run: python3 scripts/check_alpine_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Download phone-tested reference APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ilmar-debug-apk
          path: /tmp/ilmar-phone-reference
          run-id: 39479866305
          github-token: ${{ github.token }}
      - name: Inspect APK signatures and in-place update compatibility
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          python3 scripts/check_apk_update.py --candidate app/build/outputs/apk/debug/app-debug.apk --reference /tmp/ilmar-phone-reference/app-debug.apk --build-tools "$SDK_ROOT/build-tools/35.0.0" --output app/build/reports/apk-update.json
      - name: Publish APK update compatibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-update-report
          path: app/build/reports/apk-update.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ilmar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Alpine corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ilmar-alpine-corresponding-source
          include-hidden-files: true
          path: .build-alpine/native-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 14
